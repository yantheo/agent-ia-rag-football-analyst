<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests du modèle</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: system-ui, sans-serif; background: #0a0f0d; color: #e2e8e4; margin: 0; padding: 24px 16px; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p { color: #8a9a92; font-size: 0.9rem; }
  li { padding: 6px 0; border-bottom: 1px solid #1f2b26; font-size: 0.88rem; list-style: none; }
  ul { padding: 0; }
  .ok { color: #22c55e; font-weight: 700; } .ko { color: #ef4444; font-weight: 700; }
  .d { color: #8a9a92; font-family: ui-monospace, monospace; font-size: 0.8rem; display: block; margin-top: 2px; }
  #sum { font-size: 1.1rem; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Tests du modèle (model.js)</h1>
  <p>Outil de diagnostic, pas une page publique. Mêmes tests que <code>node model.tests.js</code>.</p>
  <p id="sum"></p>
  <ul id="list"></ul>
</main>
<script src="model.js"></script>
<script src="model.tests.js"></script>
<script>
  const res = ModeleTests.run();
  const ko = res.filter(r => !r.ok).length;
  document.getElementById('sum').innerHTML = `<span class="${ko ? 'ko' : 'ok'}">${res.length - ko}/${res.length} tests OK</span>`;
  document.getElementById('list').innerHTML = res.map(r =>
    `<li><span class="${r.ok ? 'ok' : 'ko'}">${r.ok ? 'OK' : 'ÉCHEC'}</span> ${r.name}<span class="d">${r.detail}</span></li>`).join('');
  if (ko) console.error(`${ko} test(s) en échec`, res.filter(r => !r.ok));
</script>
</body>
</html>
